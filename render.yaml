# =====================================================================
# RENDER BLUEPRINT CONFIGURATION (APP-INFORMES)
# https://render.com/docs/blueprint-spec
# =====================================================================

services:
  # Plataforma Web Unificada (Backend API + Frontend React SPA)
  - type: web
    name: app-informes
    runtime: node
    plan: free
    region: oregon
    branch: main
    # Fase de compilación del monorepo (asegura instalación de definiciones de tipos)
    buildCommand: npm install --include=dev && npm run build
    # Sincroniza esquema de PostgreSQL sin borrar datos existentes y arranca Express
    startCommand: npx prisma db push --accept-data-loss --schema=server/prisma/schema.prisma && node server/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: MAX_REGISTERED_USERS
        value: 5
