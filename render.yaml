# =====================================================================
# RENDER BLUEPRINT CONFIGURATION (APP-INFORMES)
# https://render.com/docs/blueprint-spec
# =====================================================================

databases:
  # Base de Datos PostgreSQL Gestionada (Capa Gratuita de Render)
  - name: app-informes-db
    databaseName: app_informes
    user: app_informes_user
    plan: free
    region: oregon

services:
  # Plataforma Web Unificada (Backend API + Frontend React SPA)
  - type: web
    name: app-informes
    runtime: node
    plan: free
    region: oregon
    branch: main
    # Fase 1: Compilación de paquetes (npm workspaces)
    buildCommand: npm install && npm run build
    # Fase 2: Pre-despliegue con acceso a la red privada de PostgreSQL
    preDeployCommand: npx prisma db push --schema=server/prisma/schema.prisma && npx tsx server/src/database/seed.ts
    # Fase 3: Arranque del servidor que sirve la API y la SPA
    startCommand: node server/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: app-informes-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: MAX_REGISTERED_USERS
        value: 5
